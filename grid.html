<style>
/* Layout: one quiet title block, one large portrait, then a two-column drift of tall photos that open into a viewer. */
:root {
  --paper: #f7f0f0;
  --paper-2: #efe4e5;
  --ink: #2c2226;
  --ink-soft: #7a6a6f;
  --rose: #b0636f;
  --line: #e0d0d2;
  --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --font-body: "Jost", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171114;
    --paper-2: #211a1d;
    --ink: #f2e8ea;
    --ink-soft: #a8979c;
    --rose: #d9899a;
    --line: #35282d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171114;
  --paper-2: #211a1d;
  --ink: #f2e8ea;
  --ink-soft: #a8979c;
  --rose: #d9899a;
  --line: #35282d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  padding-block: 56px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; }

header { text-align: center; padding-block: 8px 44px; }
.kicker {
  font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--ink-soft); margin: 0 0 28px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(34px, 8.4vw, 76px);
  line-height: 1.12;
  letter-spacing: 0.01em;
  margin: 0;
  text-wrap: balance;
}
h1 .amp {
  display: block;
  font-style: italic;
  font-weight: 300;
  color: var(--rose);
  font-size: 0.72em;
  line-height: 1;
  margin-block: 6px;
}
.rule { width: 44px; height: 1px; background: var(--rose); margin: 34px auto 0; border: 0; }

.feature { margin: 0 auto 64px; max-width: 520px; }
.feature button, .tile button {
  display: block; width: 100%; padding: 0; border: 0; background: var(--paper-2);
  cursor: zoom-in; overflow: hidden;
}
.feature img { display: block; width: 100%; height: auto; }
.cap {
  font-family: var(--font-display); font-style: italic; font-weight: 300;
  font-size: 20px; text-align: center; color: var(--ink-soft); margin: 18px 0 0;
}

.drift { columns: 2; column-gap: 14px; }
.tile { break-inside: avoid; margin: 0 0 14px; }
.tile button img { display: block; width: 100%; height: auto; transition: transform .6s ease; }
.tile button:hover img { transform: scale(1.025); }
.tile:nth-child(3n+2) { margin-top: 28px; }
button:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

footer { text-align: center; margin-top: 64px; }
footer p {
  font-family: var(--font-display); font-style: italic; font-size: 22px;
  color: var(--ink-soft); margin: 18px 0 0;
}

@media (min-width: 760px) {
  body { padding-block: 88px 104px; }
  .drift { columns: 3; column-gap: 22px; }
  .tile { margin-bottom: 22px; }
  .tile:nth-child(3n+2) { margin-top: 44px; }
}

/* viewer */
/* viewer: frosted-glass carousel (centre card, curved neighbours, floating dock) */
.viewer { position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden; color: #fff; background: rgba(22, 17, 20, .82); font-family: var(--font-body); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .viewer { background: rgba(26, 19, 23, .44); -webkit-backdrop-filter: blur(30px) saturate(1.35); backdrop-filter: blur(30px) saturate(1.35); }
}
.viewer.open { display: block; animation: vfade .35s ease; }
@keyframes vfade { from { opacity: 0; } to { opacity: 1; } }
.vstage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 38%; touch-action: pan-y; }
.vcard {
  position: absolute; left: 50%; top: 45%; border-radius: 30px; overflow: hidden; cursor: pointer;
  background: rgba(255, 255, 255, .1); backface-visibility: hidden; will-change: transform, opacity;
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .28);
  transition: transform .6s cubic-bezier(.22, .8, .24, 1), opacity .45s ease;

.vcard.center { cursor: default; }
.vimg { position: relative; width: 100%; background: #1c1618; overflow: hidden; }
.vimg img, .vimg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; user-select: none; }
.vimg video { background: #000; object-fit: contain; }
.vcard:not(.center) .vimg::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03)); }
.vcard:not(.center) .vimg img { filter: saturate(.9) brightness(.88); }
.vcap {
  height: 76px; padding: 10px 22px; display: flex; flex-direction: column; justify-content: center; gap: 3px;
  background: rgba(64, 52, 58, .62); border-top: 1px solid rgba(255, 255, 255, .22); transition: opacity .4s ease;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .vcap { background: rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); }
}
.vcard:not(.center) .vcap { opacity: .55; }
.vcap b { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 23px; line-height: 1.1; }
.vcap span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .78; }

.vglass {
  height: 44px; min-width: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  color: #fff; font: 400 14px/1 var(--font-body); letter-spacing: .03em; cursor: pointer;
  background: rgba(70, 58, 64, .6); border: 1px solid rgba(255, 255, 255, .3);
  transition: background .2s ease;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .vglass { background: rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); }
}
.vglass:hover { background: rgba(255, 255, 255, .28); }
.vglass:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.vtop {
  position: absolute; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 3;
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.vtop > * { pointer-events: auto; }
.vtop .vcount { pointer-events: none; font-variant-numeric: tabular-nums; }
.vdock {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 3;
  bottom: calc(32px + env(safe-area-inset-bottom, 0px)); width: min(92vw, 440px); height: 72px;
  display: flex; align-items: center; gap: 12px; padding: 0 10px; border-radius: 36px; transition: opacity .3s ease;
  background: rgba(70, 58, 64, .6); border: 1px solid rgba(255, 255, 255, .3);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .vdock { background: rgba(255, 255, 255, .15); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); }
}
.vdock .vglass { padding: 0; width: 44px; font-size: 26px; line-height: 1; flex: none; }
.vthumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid rgba(255, 255, 255, .55); background: #2a2025; }
.vmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.vmeta b { font: 400 14px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vmeta span { font-size: 12px; opacity: .72; font-variant-numeric: tabular-nums; }
.vbar { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3; bottom: calc(15px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .28); overflow: hidden; transition: opacity .3s ease; }
.vbar i { display: block; height: 100%; border-radius: 4px; background: #fff; transition: width .5s ease; }
.viewer.expanded .vdock, .viewer.expanded .vbar { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .vcard, .vbar i, .viewer.open { transition: none; animation: none; } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .tile button img { transition: none; }
}

<div class="wrap">

<script>
(function () {

  var CAPH = 76;
  function rel(idx) { var d = idx - cur; if (d > TOTAL / 2) d -= TOTAL; if (d < -TOTAL / 2) d += TOTAL; return d; }

    var box = document.createElement('div'); box.className = 'vimg';
    var im = document.createElement('img'); im.decoding = 'async'; im.draggable = false; im.alt = 'Memory photo ' + (idx + 1); im.src = srcOf(idx);

  }

    } else if (!on && c.vid) { c.vid.pause(); c.vid.removeAttribute('src'); c.vid.load(); c.vid.remove(); c.vid = null; }
  }
  function cardSize(idx, mw, mh) { var a = ASP[idx], w = Math.min(mw, mh * a); return { w: Math.round(w), h: Math.round(w / a) }; }

    var need = {};
    for (var t = -2; t <= 2; t++) need[wrapIdx(cur + t)] = true;
    Object.keys(need).forEach(function (k) { if (!vcards[k]) { vcards[k] = makeCard(+k); vcards[k].fresh = true; } });
    var cs = cardSize(cur, mw, mh);
    var cursor = { '-1': cs.w / 2 + 14, '1': cs.w / 2 + 14 };
    var X = {};
    [-1, 1].forEach(function (side) {
      for (var s = 1; s <= 2; s++) {

        cursor[side] += half * 2 + 6;

    });
    Object.keys(vcards).forEach(function (k) {
      var c = vcards[k], idx = +k, d = rel(idx), sz = cardSize(idx, mw, mh), x = 0, z = 0, ry = 0, sc = 1, op = 1, isC = d === 0;
      if (!isC && X[idx] && Math.abs(d) <= 2) { var g = X[idx]; x = g.x; z = -150 * g.s; ry = -g.side * g.rot; sc = g.sc; op = expanded ? 0 : (g.s === 1 ? 0.95 : 0.6); }
