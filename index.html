        var dx = p.x - nx, dz = p.z - nz, d2 = dx * dx + dz * dz;

        if (d2 > 1e-8) { var d = Math.sqrt(d2); p.x = nx + dx / d * r; p.z = nz + dz / d * r; }
        else {
          var l = p.x - b.x0, rr = b.x1 - p.x, t = p.z - b.z0, bo = b.z1 - p.z, m = Math.min(l, rr, t, bo);
          if (m === l) p.x = b.x0 - r; else if (m === rr) p.x = b.x1 + r; else if (m === t) p.z = b.z0 - r; else p.z = b.z1 + r;
        }
      }
    }
  }
  var WALLS_AND_BENCHES = SOLIDS.concat(BENCHES);

  /* ---------- picture frames ---------- */
  var glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 128;
  var gx = glowCanvas.getContext('2d');
  var grad = gx.createRadialGradient(64, 64, 6, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,236,224,0.55)'); grad.addColorStop(1, 'rgba(255,236,224,0)');
  gx.fillStyle = grad; gx.fillRect(0, 0, 128, 128);
  var glowTex = new THREE.CanvasTexture(glowCanvas);
  var glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  var frameMat = new THREE.MeshStandardMaterial({ color: 0x1b1517, roughness: 0.5 });

  var maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
  var loader = new THREE.TextureLoader();
  var pickables = [];
  var loaded = 0;

  function frameH(n) { var a = ASP[n - 1]; return a >= 1.6 ? 1.45 : a >= 1 ? 1.75 : 2.1; }
  function addFrame(n, room, side, along, scale) {
    var asp = ASP[n - 1];
    var h = frameH(n) * (scale || 1), w = h * asp;
    var g = new THREE.Group();
    var glow = new THREE.Mesh(new THREE.PlaneGeometry(w + 1.9, h + 1.5), glowMat);
    glow.position.z = 0.004; g.add(glow);
    var fr = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, h + 0.12, 0.05), frameMat);
    fr.position.z = 0.03; g.add(fr);
    var pm = new THREE.MeshBasicMaterial({ color: 0x6c6066 });
    var pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), pm);
    pic.position.z = 0.058; pic.userData.index = n - 1; g.add(pic);
    pickables.push(pic);
    if (VID[n - 1]) {
      var pc = document.createElement('canvas'); pc.width = pc.height = 128;
      var px = pc.getContext('2d');
      px.fillStyle = 'rgba(247,240,240,0.88)'; px.beginPath(); px.arc(64, 64, 58, 0, 7); px.fill();
      px.fillStyle = '#b0636f'; px.beginPath(); px.moveTo(50, 36); px.lineTo(50, 92); px.lineTo(96, 64); px.closePath(); px.fill();
      var badge = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true }));
      badge.position.z = 0.062; g.add(badge);
      badge.userData.index = n - 1; pickables.push(badge);
    }
    loader.load(tsrc(n), function (tx) {
      tx.encoding = THREE.sRGBEncoding; tx.anisotropy = maxAniso;
      pm.map = tx; pm.color.set(0xffffff); pm.needsUpdate = true;
      loaded++; if (loaded >= 4) document.getElementById('loading').classList.add('gone');
    });
    var y = 1.85;
    if (side === 'N') { g.position.set(room.cx + along, y, room.cz - HZi); }
    if (side === 'S') { g.position.set(room.cx + along, y, room.cz + HZi); g.rotation.y = Math.PI; }
    if (side === 'E') { g.position.set(room.cx + HXi, y, room.cz + along); g.rotation.y = -Math.PI / 2; }
    if (side === 'W') { g.position.set(room.cx - HXi, y, room.cz + along); g.rotation.y = Math.PI / 2; }
    scene.add(g);
  }

  (function layout() {
    var perRoom = TOTAL / ROOMS.length, n = 1;
    ROOMS.forEach(function (room, ri) {
      var last = Math.round(perRoom * (ri + 1));
      var list = []; for (; n <= last; n++) list.push(n);
      // free stretches of wall in this room
      var segs = [];
      ['N', 'E', 'S', 'W'].forEach(function (side) {
        var L = (side === 'N' || side === 'S') ? RW - 2 * T : RD - 2 * T;
        if (hasDoor(room, side)) {
          segs.push({ side: side, a: -L / 2 + 0.5, b: -DW / 2 - 0.6 });
          segs.push({ side: side, a: DW / 2 + 0.6, b: L / 2 - 0.5 });
        } else segs.push({ side: side, a: -L / 2 + 0.5, b: L / 2 - 0.5 });
      });
      var cap = segs.reduce(function (s, g) { return s + (g.b - g.a); }, 0);
      var ws = list.map(function (k) { return frameH(k) * ASP[k - 1] + 0.12; });
      var total = ws.reduce(function (a, b) { return a + b; }, 0);
      var idx = 0;
      segs.forEach(function (sg, si) {
        var len = sg.b - sg.a, share = total * len / cap, items = [], sum = 0;
        while (idx < list.length && (si === segs.length - 1 || sum + ws[idx] / 2 <= share)) { items.push(idx); sum += ws[idx]; idx++; }
        if (!items.length) return;
        var sc = Math.min(1, (len - 0.3 * items.length) / sum);
        var free = (len - sum * sc) / (items.length + 1), pos = sg.a;
        items.forEach(function (k) {
          var w = ws[k] * sc;
          pos += free + w / 2;
          addFrame(list[k], room, sg.side, pos, sc);
          pos += w / 2;
        });
      });
    });
  })();
  setTimeout(function () { document.getElementById('loading').classList.add('gone'); }, 4500);

  /* ---------- avatars ---------- */
  function mat(c, r) { return new THREE.MeshStandardMaterial({ color: c, roughness: r == null ? 0.7 : r }); }
  function makeAvatar(o) {
    var root = new THREE.Group();
    var skin = mat(o.skin, 0.8), shirt = mat(o.shirt), pants = mat(o.pants), hair = mat(o.hair, 0.9), shoe = mat(0x1d1a1c);
    var body = new THREE.Group(); root.add(body);

    var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.16, 0.62, 14), shirt);
    torso.scale.set(1.35, 1, 0.8); torso.position.y = 1.2; body.add(torso);
    var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.12, 10), skin);
    neck.position.y = 1.56; body.add(neck);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 16), skin);
    head.scale.set(0.95, 1.1, 1); head.position.y = 1.74; body.add(head);
    var cap = new THREE.Mesh(new THREE.SphereGeometry(0.162, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.52), hair);
    cap.scale.set(0.97, 1.12, 1.02); cap.position.set(0, 1.755, -0.012); body.add(cap);
    var fringe = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.05, 0.06), hair);
    fringe.position.set(0, 1.84, 0.1); body.add(fringe);
    var eyeM = mat(0x1a1416, 0.4);
    [-0.055, 0.055].forEach(function (x) {
      var e = new THREE.Mesh(new THREE.SphereGeometry(0.017, 8, 8), eyeM);
      e.position.set(x, 1.76, 0.142); body.add(e);
    });
    if (o.chain) {
      var ch = new THREE.Mesh(new THREE.TorusGeometry(0.115, 0.011, 8, 28), mat(0xd9b25a, 0.3));
      ch.rotation.x = Math.PI / 2.4; ch.position.set(0, 1.5, 0.045); body.add(ch);
    }

    function limb(rTop, rBot, len, color, x, y, z) {
      var piv = new THREE.Group(); piv.position.set(x, y, z);
      var m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, 10), color);
      m.position.y = -len / 2; piv.add(m); body.add(piv); return piv;
    }
    var legL = limb(0.085, 0.07, 0.9, pants, -0.1, 0.92, 0);
    var legR = limb(0.085, 0.07, 0.9, pants, 0.1, 0.92, 0);
    [legL, legR].forEach(function (p) {
      var s = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.07, 0.24), shoe);
      s.position.set(0, -0.9, 0.04); p.add(s);
    });
    var armL = limb(0.058, 0.05, 0.56, skin, -0.3, 1.46, 0);
    var armR = limb(0.058, 0.05, 0.56, skin, 0.3, 1.46, 0);
    [armL, armR].forEach(function (p, i) {
      var sl = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.066, 0.2, 10), shirt);
      sl.position.y = -0.1; p.add(sl);
    });

    // name tag
    var c = document.createElement('canvas'); c.width = 320; c.height = 80;
    var tex = new THREE.CanvasTexture(c);
    function paint() {
      var x = c.getContext('2d'); x.clearRect(0, 0, 320, 80);
      x.font = 'italic 400 40px "Cormorant Garamond", Georgia, serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = 7; x.strokeStyle = 'rgba(247,240,240,0.9)'; x.strokeText(o.name, 160, 40);
      x.fillStyle = '#2c2226'; x.fillText(o.name, 160, 40);
      tex.needsUpdate = true;
    }
    paint();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
    sp.scale.set(1.5, 0.375, 1); sp.position.y = 2.25; root.add(sp);

    scene.add(root);
    return { root: root, body: body, legL: legL, legR: legR, armL: armL, armR: armR, phase: 0, speed: 0 };
  }

  var A = makeAvatar({ name: 'JayBee.B', skin: 0xe6c3a2, hair: 0x1c1517, shirt: 0xf6f3f1, pants: 0x3a3f4a });
  var B = makeAvatar({ name: 'Alprince', skin: 0xc58f66, hair: 0x181214, shirt: 0x6f3e49, pants: 0x4a5560, chain: true });

  /* ---------- state ---------- */
  var P = { x: -14, z: -3 };       // point between the two
  var heading = Math.PI;           // facing -z (toward the dark wall)
  var camYaw = 0, camPitch = 0.34, camDist = 5.4;
  var camTarget = new THREE.Vector3(-14, 1.3, -3);
  var joy = { x: 0, y: 0 };
  var keys = {};
  var tour = false, wpIndex = 0;
  var WAYPOINTS = (function () {
    var R = ROOMS, w = [];
    function C(i) { return R[i]; }
    // top row, west to east
    [0, 1, 2].forEach(function (i) {
      var r = C(i);
      if (i < 2) w.push([r.cx - 5, r.cz], [r.cx - 4, r.cz - 3], [r.cx + 4, r.cz - 3], [r.cx + 5, r.cz]);
      else w.push([r.cx - 5, r.cz], [r.cx - 4, r.cz - 3], [r.cx + 4, r.cz - 3], [r.cx + 4, r.cz + 3], [r.cx, r.cz + 3]);
    });
    // bottom row, east to west
    var r5 = C(5); w.push([r5.cx, r5.cz - 3], [r5.cx + 4, r5.cz - 3], [r5.cx + 4, r5.cz + 3], [r5.cx - 4, r5.cz + 3], [r5.cx - 4, r5.cz]);
    var r4 = C(4); w.push([r4.cx + 5, r4.cz], [r4.cx + 4, r4.cz + 3], [r4.cx - 4, r4.cz + 3], [r4.cx - 5, r4.cz]);
    var r3 = C(3); w.push([r3.cx + 5, r3.cz], [r3.cx + 4, r3.cz + 3], [r3.cx - 4, r3.cz + 3], [r3.cx - 4, r3.cz - 3], [r3.cx, r3.cz - 3]);
    var r0 = C(0); w.push([r0.cx, r0.cz + 3]);
    return w;
  })();
  var SIDE = 0.5;
  var pos = { a: new THREE.Vector3(-14 - SIDE, 0, -3), b: new THREE.Vector3(-14 + SIDE, 0, -3) };
  var hintEl = document.getElementById('hint');
  var moved = false;

  function clampP() { pushOut(P, 0.8, WALLS_AND_BENCHES); }
  function angDiff(a, b) { var d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }
  function setTour(on) {
    tour = on;
    var b = document.getElementById('tour');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? 'Зогсоох' : 'Автомат алхах';
    if (on) {
      var best = 0, bd = 1e9;
      WAYPOINTS.forEach(function (w, i) { var d = Math.hypot(w[0] - P.x, w[1] - P.z); if (d < bd) { bd = d; best = i; } });
      wpIndex = best;
    }
  }
  document.getElementById('tour').addEventListener('click', function () { setTour(!tour); });

  function noteMove() { if (!moved) { moved = true; hintEl.classList.add('gone'); } }

  /* ---------- controls ---------- */
  var stick = document.getElementById('stick'), knob = document.getElementById('knob');
  var stickId = null, sCx = 0, sCy = 0, R = 42;
  function stickMove(e) {
    var dx = e.clientX - sCx, dy = e.clientY - sCy, d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    joy.x = dx / R; joy.y = -dy / R;
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  stick.addEventListener('pointerdown', function (e) {
    stickId = e.pointerId; stick.setPointerCapture(e.pointerId);
    var r = stick.getBoundingClientRect(); sCx = r.left + r.width / 2; sCy = r.top + r.height / 2;
    stickMove(e); if (tour) setTour(false);
  });
  stick.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) stickMove(e); });
  function stickEnd(e) {
    if (e.pointerId !== stickId) return;
    stickId = null; joy.x = joy.y = 0; knob.style.transform = 'translate(0,0)';
  }
  stick.addEventListener('pointerup', stickEnd);
  stick.addEventListener('pointercancel', stickEnd);

  window.addEventListener('keydown', function (e) {
    if (viewer.classList.contains('open')) {
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') show(cur - 1);
      else if (e.key === 'ArrowRight') show(cur + 1);
      return;
    }
    var k = e.key.toLowerCase();
    if ('wasd'.indexOf(k) >= 0 || k.indexOf('arrow') === 0) { keys[k] = true; if (tour) setTour(false); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  var drag = null, raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  canvas.addEventListener('pointerdown', function (e) {
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    camYaw -= (e.clientX - drag.x) * 0.0065;
    camPitch = Math.max(0.12, Math.min(0.75, camPitch + (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var moved6 = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6;
    drag = null;
    if (moved6) return;
    var r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var hit = raycaster.intersectObjects(pickables, false)[0];
    if (hit) openViewer(hit.object.userData.index);
  });
  canvas.addEventListener('pointercancel', function () { drag = null; });

  /* ---------- sizing ---------- */
  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 66 : 56;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));
  resize();

  /* ---------- loop ---------- */
  function animateAvatar(av, dt, speed) {
    av.speed += (speed - av.speed) * Math.min(1, dt * 10);
    av.phase += dt * (3 + av.speed * 2.6);
    var amp = Math.min(0.75, av.speed * 0.34);
    var s = Math.sin(av.phase);
    av.legL.rotation.x = s * amp; av.legR.rotation.x = -s * amp;
    av.armL.rotation.x = -s * amp * 0.85; av.armR.rotation.x = s * amp * 0.85;
    av.body.position.y = Math.abs(Math.cos(av.phase)) * 0.035 * Math.min(1, av.speed);
  }

  var last = performance.now();
  var targetSpeed = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var frozen = viewer.classList.contains('open');

    var ix = joy.x, iy = joy.y;
    if (keys['w'] || keys['arrowup']) iy += 1;
    if (keys['s'] || keys['arrowdown']) iy -= 1;
    if (keys['d']) ix += 1;
    if (keys['a']) ix -= 1;
    if (keys['arrowleft']) camYaw += dt * 1.6;
    if (keys['arrowright']) camYaw -= dt * 1.6;
    var mag = Math.min(1, Math.hypot(ix, iy));
    var mx = 0, mz = 0, spd = 0;

    if (!frozen) {
      if (mag > 0.08) {
        noteMove();
        var fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
        var rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
        mx = fx * iy + rx * ix; mz = fz * iy + rz * ix;
        var l = Math.hypot(mx, mz); mx /= l; mz /= l;
        spd = 2.7 * mag;
      } else if (tour) {
        noteMove();
        var w = WAYPOINTS[wpIndex];
        var dx = w[0] - P.x, dz = w[1] - P.z, d = Math.hypot(dx, dz);
        if (d < 0.35) { wpIndex = (wpIndex + 1) % WAYPOINTS.length; }
        else { mx = dx / d; mz = dz / d; spd = 1.9; }
      }
      if (spd > 0) {
        P.x += mx * spd * dt; P.z += mz * spd * dt; clampP();
        var want = Math.atan2(mx, mz);
        heading += angDiff(want, heading) * Math.min(1, dt * 7);
      }
    }

    // keep heading in range and place the two side by side
    var rx2 = -Math.cos(heading), rz2 = Math.sin(heading);
    var ta = new THREE.Vector3(P.x - rx2 * SIDE, 0, P.z - rz2 * SIDE);
    var tb = new THREE.Vector3(P.x + rx2 * SIDE, 0, P.z + rz2 * SIDE);
    var pa = pos.a.clone(), pb = pos.b.clone();
    var k = Math.min(1, dt * 7);
    pos.a.lerp(ta, k); pos.b.lerp(tb, k * 0.92);
    var va = pos.a.distanceTo(pa) / Math.max(dt, 1e-4);
    var vb = pos.b.distanceTo(pb) / Math.max(dt, 1e-4);
    A.root.position.copy(pos.a); B.root.position.copy(pos.b);
    A.root.rotation.y = heading; B.root.rotation.y = heading;
    animateAvatar(A, dt, Math.min(3.2, va));
    animateAvatar(B, dt, Math.min(3.2, vb));

    // camera
    var cx = (pos.a.x + pos.b.x) / 2, cz = (pos.a.z + pos.b.z) / 2;
    camTarget.x += (cx - camTarget.x) * Math.min(1, dt * 6);
    camTarget.z += (cz - camTarget.z) * Math.min(1, dt * 6);
    var cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    var camX = camTarget.x + Math.sin(camYaw) * cp * camDist;
    var camZ = camTarget.z + Math.cos(camYaw) * cp * camDist;
    var camY = 1.2 + sp * camDist;
    var cpnt = { x: camX, z: camZ };
    // keep the camera on the avatars' side of any wall between them
    var seg = 6, ok = true;
    for (var si = 1; si <= seg; si++) {
      var qx = camTarget.x + (camX - camTarget.x) * si / seg, qz = camTarget.z + (camZ - camTarget.z) * si / seg;
      var hit = false;
      for (var bi = 0; bi < SOLIDS.length; bi++) { var bx = SOLIDS[bi]; if (qx > bx.x0 - 0.3 && qx < bx.x1 + 0.3 && qz > bx.z0 - 0.3 && qz < bx.z1 + 0.3) { hit = true; break; } }
      if (hit) { var f = Math.max(0.15, (si - 1.4) / seg); camX = camTarget.x + (cpnt.x - camTarget.x) * f; camZ = camTarget.z + (cpnt.z - camTarget.z) * f; break; }
    }
    camY = Math.max(0.9, Math.min(RH - 0.3, camY));
    camera.position.set(camX, camY, camZ);
    camera.lookAt(camTarget.x, 1.15, camTarget.z);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
