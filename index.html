      var dN = P.z - (room.cz - HZi), dS = (room.cz + HZi) - P.z;
      if (dN < dS) { nx = 0; nz = 1; wallYaw = 0; } else { nx = 0; nz = -1; wallYaw = Math.PI; }
    } else {                                 // walking north/south -> nearer east/west wall
      var dW = P.x - (room.cx - HXi), dE = (room.cx + HXi) - P.x;
      if (dW < dE) { nx = 1; nz = 0; wallYaw = Math.PI / 2; } else { nx = -1; nz = 0; wallYaw = -Math.PI / 2; }
    }
    var behind = heading + Math.PI;
    var a1 = wallYaw + 0.55, a2 = wallYaw - 0.55;
    var want = Math.abs(angDiff(a1, behind)) < Math.abs(angDiff(a2, behind)) ? a1 : a2;
    var k = Math.min(1, dt * 1.3);
    camYaw += angDiff(want, camYaw) * k;
    camPitch += (0.2 - camPitch) * k;
    camDist += (6.4 - camDist) * k;
    lookNx += (-nx - lookNx) * k; lookNz += (-nz - lookNz) * k;
    lookOff += (2.4 - lookOff) * k;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var frozen = viewer.classList.contains('open');

    var ix = joy.x, iy = joy.y;
    if (keys['w'] || keys['arrowup']) iy += 1;
    if (keys['s'] || keys['arrowdown']) iy -= 1;
    if (keys['d']) ix += 1;
    if (keys['a']) ix -= 1;
    if (keys['arrowleft']) camYaw += dt * 1.6;
    if (keys['arrowright']) camYaw -= dt * 1.6;
    var mag = Math.min(1, Math.hypot(ix, iy));
    var mx = 0, mz = 0, spd = 0;

    if (!frozen) {
      if (mag > 0.08) {
        noteMove();
        var fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
        var rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
        mx = fx * iy + rx * ix; mz = fz * iy + rz * ix;
        var l = Math.hypot(mx, mz); mx /= l; mz /= l;
        spd = 2.7 * mag;
      } else if (tour) {
        noteMove();
        var w = WAYPOINTS[wpIndex];
        var dx = w[0] - P.x, dz = w[1] - P.z, d = Math.hypot(dx, dz);
        if (d < 0.35) { wpIndex = (wpIndex + 1) % WAYPOINTS.length; }
        else { mx = dx / d; mz = dz / d; spd = 1.45; }
      }
      if (spd > 0) {
        P.x += mx * spd * dt; P.z += mz * spd * dt; clampP();
        var want = Math.atan2(mx, mz);
        heading += angDiff(want, heading) * Math.min(1, dt * 7);
      }
    }

    // keep heading in range and place the two side by side
    var rx2 = -Math.cos(heading), rz2 = Math.sin(heading);
    var ta = new THREE.Vector3(P.x - rx2 * SIDE, 0, P.z - rz2 * SIDE);
    var tb = new THREE.Vector3(P.x + rx2 * SIDE, 0, P.z + rz2 * SIDE);
    var pa = pos.a.clone(), pb = pos.b.clone();
    var k = Math.min(1, dt * 7);
    pos.a.lerp(ta, k); pos.b.lerp(tb, k * 0.92);
    var va = pos.a.distanceTo(pa) / Math.max(dt, 1e-4);
    var vb = pos.b.distanceTo(pb) / Math.max(dt, 1e-4);
    A.root.position.copy(pos.a); B.root.position.copy(pos.b);
    A.root.rotation.y = heading; B.root.rotation.y = heading;
    animateAvatar(A, dt, Math.min(3.2, va));
    animateAvatar(B, dt, Math.min(3.2, vb));

    // camera
    var tourCam = tour && !frozen && !drag && mag <= 0.08;
    if (tourCam) tourCamera(dt);
    else {
      var kk = Math.min(1, dt * 2.2);
      lookOff += (0 - lookOff) * kk;
      if (!drag && Math.abs(camDist - 5.4) > 0.02) { camDist += (5.4 - camDist) * kk; if (!tour) camPitch += (0.34 - camPitch) * kk; }
    }
    var cx = (pos.a.x + pos.b.x) / 2, cz = (pos.a.z + pos.b.z) / 2;
    camTarget.x += (cx - camTarget.x) * Math.min(1, dt * 6);
    camTarget.z += (cz - camTarget.z) * Math.min(1, dt * 6);
    var cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    var camX = camTarget.x + Math.sin(camYaw) * cp * camDist;
    var camZ = camTarget.z + Math.cos(camYaw) * cp * camDist;
    var camY = 1.2 + sp * camDist;
    var cpnt = { x: camX, z: camZ };
    // keep the camera on the avatars' side of any wall between them
    var seg = 6, ok = true;
    for (var si = 1; si <= seg; si++) {
      var qx = camTarget.x + (camX - camTarget.x) * si / seg, qz = camTarget.z + (camZ - camTarget.z) * si / seg;
      var hit = false;
      for (var bi = 0; bi < SOLIDS.length; bi++) { var bx = SOLIDS[bi]; if (qx > bx.x0 - 0.3 && qx < bx.x1 + 0.3 && qz > bx.z0 - 0.3 && qz < bx.z1 + 0.3) { hit = true; break; } }
      if (hit) { var f = Math.max(0.15, (si - 1.4) / seg); camX = camTarget.x + (cpnt.x - camTarget.x) * f; camZ = camTarget.z + (cpnt.z - camTarget.z) * f; break; }
    }
    camY = Math.max(0.9, Math.min(RH - 0.3, camY));
    camera.position.set(camX, camY, camZ);
    camera.lookAt(camTarget.x + lookNx * lookOff, 1.15 + lookOff * 0.16, camTarget.z + lookNz * lookOff);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
/* Background music: the user's YouTube track, played in a hidden looping embed.
   Browsers need a gesture, so it starts on the first touch/click; the button mutes/unmutes. */
(function () {
  var VID_ID = '_ZKliUdu4T0', btn = document.getElementById('music');
  if (!btn) return;
  var on = true, frame = null, started = false, failed = false;
  try { if (localStorage.getItem('jb-music') === 'off') on = false; } catch (e) {}
  function paint() {
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.textContent = failed ? '♪ Can\'t play' : (on ? '♪ Music' : '♪ Muted');
    btn.style.opacity = on && !failed ? 1 : .65;
  }
  paint();
  function cmd(fn, args) {
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: fn, args: args || [] }), '*');
  }
  function build() {
    frame = document.createElement('iframe');
    frame.title = 'Background music';
    frame.allow = 'autoplay; encrypted-media';
    frame.setAttribute('aria-hidden', 'true'); frame.tabIndex = -1;
    frame.src = 'https://www.youtube.com/embed/' + VID_ID + '?enablejsapi=1&autoplay=1&loop=1&playlist=' + VID_ID +
      '&controls=0&disablekb=1&playsinline=1&rel=0&modestbranding=1&origin=' + encodeURIComponent(location.origin);
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;border:0;z-index:-1';
    frame.addEventListener('load', function () {
      frame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1 }), '*');
      setTimeout(function () { cmd(on ? 'playVideo' : 'pauseVideo'); cmd('setVolume', [70]); }, 600);
    });
    document.body.appendChild(frame);
  }
  window.addEventListener('message', function (e) {
    if (!/youtube\.com$/.test(e.origin.replace(/^https?:\/\//, ''))) return;
    var d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (d && d.event === 'onError') { failed = true; paint(); }
    if (d && d.event === 'infoDelivery' && d.info && d.info.playerState === 0) cmd('playVideo'); // ended -> loop
  });
  function start() {
    if (!started) { started = true; build(); return; }
    if (on) cmd('playVideo');
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { if (e.target === btn) return; if (on) start(); }, { passive: true });
  });
  btn.addEventListener('click', function () {
    on = !on; paint(); try { localStorage.setItem('jb-music', on ? 'on' : 'off'); } catch (e) {}
    if (!started) { if (on) start(); return; }
    cmd(on ? 'playVideo' : 'pauseVideo');
  });
})();
</script>
