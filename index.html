<script>

  }

  if (typeof THREE === 'undefined') { showFallback(); return; }

  var canvas = document.getElementById('gl');
  var renderer;

    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  } catch (err) { showFallback(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x2a2428, 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(58, 1, 0.1, 140);

  /* ---------- room ---------- */
  var RW = 52, RD = 32, RH = 4.4, HX = RW / 2, HZ = RD / 2;
  scene.add(new THREE.AmbientLight(0xfff3f1, 0.95));

  var ceilMat = new THREE.MeshBasicMaterial({ color: 0x2b2529, side: THREE.DoubleSide });
  var ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), ceilMat);
  ceil.rotation.x = Math.PI / 2; ceil.position.y = RH; scene.add(ceil);

  function wall(w, color, px, pz, ry) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, RH), new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 }));
    m.position.set(px, RH / 2, pz); m.rotation.y = ry; scene.add(m); return m;
  }
  wall(RW, 0x2a232b, 0, -HZ, 0);              // north (dark feature wall)
  wall(RW, 0xefebe9, 0, HZ, Math.PI);         // south
  wall(RD, 0xebe6e5, HX, 0, -Math.PI / 2);    // east
  wall(RD, 0xebe6e5, -HX, 0, Math.PI / 2);    // west

  // baseboards
  var bbMat = new THREE.MeshStandardMaterial({ color: 0xcdb9bb, roughness: 0.8 });
  [[RW, 0.12, 0.06, 0, 0.06, -HZ + 0.03], [RW, 0.12, 0.06, 0, 0.06, HZ - 0.03]].forEach(function (b) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(b[0], b[1], b[2]), bbMat); m.position.set(b[3], b[4], b[5]); scene.add(m);
  });
  [[0.06, 0.12, RD, HX - 0.03, 0.06, 0], [0.06, 0.12, RD, -HX + 0.03, 0.06, 0]].forEach(function (b) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(b[0], b[1], b[2]), bbMat); m.position.set(b[3], b[4], b[5]); scene.add(m);
  });

  // light tracks on the ceiling

  [-HZ + 1.4, HZ - 1.4].forEach(function (z) {

  var benchMat = new THREE.MeshStandardMaterial({ color: 0xb9a48f, roughness: 0.7 });

  benchTop.position.set(0, 0.49, 0); scene.add(benchTop);

  /* ---------- picture frames ---------- */
  var glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 128;
  var gx = glowCanvas.getContext('2d');
  var grad = gx.createRadialGradient(64, 64, 6, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,236,224,0.55)'); grad.addColorStop(1, 'rgba(255,236,224,0)');
  gx.fillStyle = grad; gx.fillRect(0, 0, 128, 128);
  var glowTex = new THREE.CanvasTexture(glowCanvas);
  var glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  var frameMat = new THREE.MeshStandardMaterial({ color: 0x1b1517, roughness: 0.5 });

  var maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
  var loader = new THREE.TextureLoader();
  var pickables = [];
  var loaded = 0;

  function frameH(n) { var a = ASP[n - 1]; return a >= 1.6 ? 1.45 : a >= 1 ? 1.75 : 2.1; }
  function addFrame(n, wall, along, scale) {
    var asp = ASP[n - 1];
    var h = frameH(n) * (scale || 1), w = h * asp;
    var g = new THREE.Group();
    var glow = new THREE.Mesh(new THREE.PlaneGeometry(w + 1.9, h + 1.5), glowMat);
    glow.position.z = 0.004; g.add(glow);
    var fr = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, h + 0.12, 0.05), frameMat);
    fr.position.z = 0.03; g.add(fr);
    var pm = new THREE.MeshBasicMaterial({ color: 0x6c6066 });
    var pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), pm);
    pic.position.z = 0.058; pic.userData.index = n - 1; g.add(pic);
    pickables.push(pic);
    loader.load(tsrc(n), function (tx) {
      tx.encoding = THREE.sRGBEncoding; tx.anisotropy = maxAniso;
      pm.map = tx; pm.color.set(0xffffff); pm.needsUpdate = true;
      loaded++; if (loaded >= 4) document.getElementById('loading').classList.add('gone');
    });
    var y = 1.9 * (scale && scale > 1 ? 1.08 : 1);
    if (wall === 'N') { g.position.set(along, y, -HZ); }
    if (wall === 'S') { g.position.set(along, y, HZ); g.rotation.y = Math.PI; }
    if (wall === 'E') { g.position.set(HX, y, along); g.rotation.y = -Math.PI / 2; }
    if (wall === 'W') { g.position.set(-HX, y, along); g.rotation.y = Math.PI / 2; }
    scene.add(g);
  }
  function spread(list, wall, length, scales) {
    list.forEach(function (n, i) {
      addFrame(n, wall, -length / 2 + (i + 0.5) * length / list.length, scales && scales[n]);

    var ws = [], total = 0, n;
    for (n = 1; n <= TOTAL; n++) { var w = frameH(n) * ASP[n - 1] + 0.12; ws.push(w); total += w; }

    [-0.055, 0.055].forEach(function (x) {

      x.lineWidth = 7; x.strokeStyle = 'rgba(247,240,240,0.9)'; x.strokeText(o.name, 160, 40);

    sp.scale.set(1.5, 0.375, 1); sp.position.y = 2.25; root.add(sp);

    scene.add(root);
    return { root: root, body: body, legL: legL, legR: legR, armL: armL, armR: armR, phase: 0, speed: 0 };
  }

  var A = makeAvatar({ name: 'JayBee.B', skin: 0xe6c3a2, hair: 0x1c1517, shirt: 0xf6f3f1, pants: 0x3a3f4a });
  var B = makeAvatar({ name: 'Alprince', skin: 0xc58f66, hair: 0x181214, shirt: 0x6f3e49, pants: 0x4a5560, chain: true });

  /* ---------- state ---------- */
  var P = { x: 0, z: 5.2 };        // point between the two
  var heading = Math.PI;           // facing -z (toward the dark wall)
  var camYaw = 0, camPitch = 0.34, camDist = 5.4;
  var camTarget = new THREE.Vector3(0, 1.3, 5.2);
  var joy = { x: 0, y: 0 };
  var keys = {};
  var tour = false, wpIndex = 0;
  var WAYPOINTS = [[-HX + 4, -HZ + 4], [HX - 4, -HZ + 4], [HX - 4, HZ - 4], [-HX + 4, HZ - 4]];
  var SIDE = 0.5;
  var pos = { a: new THREE.Vector3(-SIDE, 0, 5.2), b: new THREE.Vector3(SIDE, 0, 5.2) };
  var hintEl = document.getElementById('hint');
  var moved = false;

  function clampP() {
    P.x = Math.max(-HX + 1.7, Math.min(HX - 1.7, P.x));
    P.z = Math.max(-HZ + 1.7, Math.min(HZ - 1.7, P.z));
    var bx = 2.5, bz = 1.35;           // bench keep-out
    if (Math.abs(P.x) < bx && Math.abs(P.z) < bz) {
      var dx = bx - Math.abs(P.x), dz = bz - Math.abs(P.z);
      if (dz < dx) P.z = (P.z >= 0 ? 1 : -1) * bz; else P.x = (P.x >= 0 ? 1 : -1) * bx;
    }
  }
  function angDiff(a, b) { var d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }
  function setTour(on) {
    tour = on;
    var b = document.getElementById('tour');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? 'Зогсоох' : 'Автомат алхах';
    if (on) {
      var best = 0, bd = 1e9;
      WAYPOINTS.forEach(function (w, i) { var d = Math.hypot(w[0] - P.x, w[1] - P.z); if (d < bd) { bd = d; best = i; } });
      wpIndex = best;
    }
  }
  document.getElementById('tour').addEventListener('click', function () { setTour(!tour); });

  function noteMove() { if (!moved) { moved = true; hintEl.classList.add('gone'); } }

  /* ---------- controls ---------- */
  var stick = document.getElementById('stick'), knob = document.getElementById('knob');
  var stickId = null, sCx = 0, sCy = 0, R = 42;
  function stickMove(e) {
    var dx = e.clientX - sCx, dy = e.clientY - sCy, d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    joy.x = dx / R; joy.y = -dy / R;
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  stick.addEventListener('pointerdown', function (e) {
    stickId = e.pointerId; stick.setPointerCapture(e.pointerId);
    var r = stick.getBoundingClientRect(); sCx = r.left + r.width / 2; sCy = r.top + r.height / 2;
    stickMove(e); if (tour) setTour(false);
  });
  stick.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) stickMove(e); });
  function stickEnd(e) {
    if (e.pointerId !== stickId) return;
    stickId = null; joy.x = joy.y = 0; knob.style.transform = 'translate(0,0)';
  }
  stick.addEventListener('pointerup', stickEnd);
  stick.addEventListener('pointercancel', stickEnd);

  window.addEventListener('keydown', function (e) {
    if (viewer.classList.contains('open')) {
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') show(cur - 1);
      else if (e.key === 'ArrowRight') show(cur + 1);
      return;
    }
    var k = e.key.toLowerCase();
    if ('wasd'.indexOf(k) >= 0 || k.indexOf('arrow') === 0) { keys[k] = true; if (tour) setTour(false); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  var drag = null, raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  canvas.addEventListener('pointerdown', function (e) {
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    camYaw -= (e.clientX - drag.x) * 0.0065;
    camPitch = Math.max(0.12, Math.min(0.75, camPitch + (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var moved6 = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6;
    drag = null;
    if (moved6) return;
    var r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var hit = raycaster.intersectObjects(pickables, false)[0];
    if (hit) openViewer(hit.object.userData.index);
  });
  canvas.addEventListener('pointercancel', function () { drag = null; });

  /* ---------- sizing ---------- */
  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 66 : 56;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));
  resize();

  /* ---------- loop ---------- */
  function animateAvatar(av, dt, speed) {
    av.speed += (speed - av.speed) * Math.min(1, dt * 10);
    av.phase += dt * (3 + av.speed * 2.6);
    var amp = Math.min(0.75, av.speed * 0.34);
    var s = Math.sin(av.phase);
    av.legL.rotation.x = s * amp; av.legR.rotation.x = -s * amp;
    av.armL.rotation.x = -s * amp * 0.85; av.armR.rotation.x = s * amp * 0.85;
    av.body.position.y = Math.abs(Math.cos(av.phase)) * 0.035 * Math.min(1, av.speed);
  }

  var last = performance.now();
  var targetSpeed = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var frozen = viewer.classList.contains('open');

    var ix = joy.x, iy = joy.y;
    if (keys['w'] || keys['arrowup']) iy += 1;
    if (keys['s'] || keys['arrowdown']) iy -= 1;
    if (keys['d']) ix += 1;
    if (keys['a']) ix -= 1;
    if (keys['arrowleft']) camYaw += dt * 1.6;
    if (keys['arrowright']) camYaw -= dt * 1.6;
    var mag = Math.min(1, Math.hypot(ix, iy));
    var mx = 0, mz = 0, spd = 0;

    if (!frozen) {
      if (mag > 0.08) {
        noteMove();
        var fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
        var rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
        mx = fx * iy + rx * ix; mz = fz * iy + rz * ix;
        var l = Math.hypot(mx, mz); mx /= l; mz /= l;
        spd = 2.7 * mag;
      } else if (tour) {
        noteMove();
        var w = WAYPOINTS[wpIndex];
        var dx = w[0] - P.x, dz = w[1] - P.z, d = Math.hypot(dx, dz);
        if (d < 0.35) { wpIndex = (wpIndex + 1) % WAYPOINTS.length; }
        else { mx = dx / d; mz = dz / d; spd = 1.9; }
      }
      if (spd > 0) {
        P.x += mx * spd * dt; P.z += mz * spd * dt; clampP();
        var want = Math.atan2(mx, mz);
        heading += angDiff(want, heading) * Math.min(1, dt * 7);
      }
    }

    // keep heading in range and place the two side by side
    var rx2 = -Math.cos(heading), rz2 = Math.sin(heading);
    var ta = new THREE.Vector3(P.x - rx2 * SIDE, 0, P.z - rz2 * SIDE);
    var tb = new THREE.Vector3(P.x + rx2 * SIDE, 0, P.z + rz2 * SIDE);
    var pa = pos.a.clone(), pb = pos.b.clone();
    var k = Math.min(1, dt * 7);
    pos.a.lerp(ta, k); pos.b.lerp(tb, k * 0.92);
    var va = pos.a.distanceTo(pa) / Math.max(dt, 1e-4);
    var vb = pos.b.distanceTo(pb) / Math.max(dt, 1e-4);
    A.root.position.copy(pos.a); B.root.position.copy(pos.b);
    A.root.rotation.y = heading; B.root.rotation.y = heading;
    animateAvatar(A, dt, Math.min(3.2, va));
    animateAvatar(B, dt, Math.min(3.2, vb));

    // camera
    var cx = (pos.a.x + pos.b.x) / 2, cz = (pos.a.z + pos.b.z) / 2;
    camTarget.x += (cx - camTarget.x) * Math.min(1, dt * 6);
    camTarget.z += (cz - camTarget.z) * Math.min(1, dt * 6);
    var cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    var camX = camTarget.x + Math.sin(camYaw) * cp * camDist;
    var camZ = camTarget.z + Math.cos(camYaw) * cp * camDist;
    var camY = 1.2 + sp * camDist;
    camX = Math.max(-HX + 0.5, Math.min(HX - 0.5, camX));
    camZ = Math.max(-HZ + 0.5, Math.min(HZ - 0.5, camZ));
    camY = Math.max(0.9, Math.min(RH - 0.3, camY));
    camera.position.set(camX, camY, camZ);
    camera.lookAt(camTarget.x, 1.15, camTarget.z);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
